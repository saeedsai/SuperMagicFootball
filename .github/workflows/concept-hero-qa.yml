name: Concept Hero Playable Prototype QA
on:
  push:
    branches: [dev]
    paths:
      - 'assets/concept_hero/**'
      - 'src/modules/concepthero.js'
      - 'src/modules/render.js'
      - 'src/modules/ui.js'
      - 'tests/concept_hero*'
      - 'tests/concept_royals*'
      - 'concept-royals-visual-qa.html'
      - 'scripts/clean_concept_hero_atlas.py'
      - 'tests/pitch_length_20pct.test.cjs'
      - 'sw.js'
      - '.github/workflows/concept-hero-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  playable:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Chromium, Playwright and Pillow
        run: |
          python3 -m pip install --user playwright pillow
          # Ubuntu's chromium apt package invokes snap; snapcraft 408 responses
          # must not block art QA. Use the same Playwright browser as Full Census.
          python3 -m playwright install --with-deps chromium
          browser_path="$(python3 -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          test -x "$browser_path"
          sudo ln -sf "$browser_path" /usr/bin/chromium
          /usr/bin/chromium --version
      - name: Build and validate existing game and roster data
        run: |
          python3 scripts/validate_data.py
          python3 scripts/build.py
      - name: Run all active Node regression tests
        run: node --test tests/*.test.cjs
      - name: Play Concept Royals FC in Chromium, verify sprites, capture screenshots
        run: python3 tests/concept_hero_browser_qa.py
      - name: Capture 12-player five-view idle and 300-frame running sheets in Chromium
        run: python3 tests/concept_royals_sheet_browser_qa.py
      - name: Verify all sprite transparency islands and alternate running strides
        run: python3 tests/concept_hero_animation_qa.py
      - name: Retain actual game screenshot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: concept-hero-playable-screenshots
          path: docs/qa_runs_concept_hero/
          retention-days: 30
