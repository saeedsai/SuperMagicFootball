name: Probe FC27 Club Source
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/fc27-source-probe.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Check public FC27 data CSV and wiki fallbacks
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,csv,io,collections
          url='https://raw.githubusercontent.com/LakshmiKanth11/EA_FC_ANALYSIS/main/EA_FC_PLAYERS_DATASET_AND_%20DASHBOARD/data/players.csv'
          for link in [url,'https://en.wikipedia.org/wiki/AEK_Athens_F.C.','https://www.fccareer.ai/teams/arsenal']:
              try:
                  req=urllib.request.Request(link,headers={'User-Agent':'SuperMagicFootballRosterAuditor/1.0 (contact: github.com/saeedsai/SuperMagicFootball)','Accept':'text/html, text/csv'})
                  data=urllib.request.urlopen(req,timeout=25).read()
                  print('FETCH',link,'OK',len(data),data[:100],flush=True)
                  if link==url:
                      rdr=csv.DictReader(io.StringIO(data.decode('utf-8-sig')))
                      print('FIELDS',rdr.fieldnames,flush=True)
                      rows=list(rdr)
                      print('PLAYERS',len(rows),'ARSENAL',[(r.get('common_name'),r.get('last_name'),r.get('position'),r.get('overall_rating')) for r in rows if r.get('club')=='Arsenal'][:10],flush=True)
                      clubs=collections.Counter(r.get('club') for r in rows if r.get('gender')!="Women's Football")
                      print('CLUBS',clubs.most_common(30),flush=True)
              except Exception as exc:print('FAILED',link,str(exc),flush=True)
          PY
