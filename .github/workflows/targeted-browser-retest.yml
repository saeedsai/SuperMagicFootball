name: Targeted Browser Regression Retest
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/targeted-browser-retest.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright and Chromium
        run: |
          python3 -m pip install --user playwright
          sudo apt-get update -qq
          sudo apt-get install -y chromium
      - name: Prepare current modular browser fixture
        run: |
          python3 scripts/build.py
          cp tests/.generated/play.html play.html
          mkdir -p docs/qa_runs_v082530 docs/qa_runs_targeted
      - name: Run previously failing browser regressions
        shell: bash
        run: |
          python3 - <<'PY'
          import json,subprocess,sys,pathlib
          root=pathlib.Path('.')
          current=json.loads((root/'package.json').read_text())['version']+'-integrated'
          names='control_reliability_browser_qa.py master_ui_contracts.py v08202_rosters_browser_qa.py v08231_bpw_alltime_browser_qa.py aerial_browser_qa.py dribble_styles_browser_qa.py morale_browser_qa.py v08195_overall_browser_qa.py v08203_rosters_browser_qa.py ai_browser_qa.py v08196_keeper_browser_qa.py v08205_rosters_browser_qa.py kits_browser_qa.py tactics_browser_qa.py v08193_ui_browser_qa.py v08197_keeper_browser_qa.py v0822_bpw_world_cups_browser_qa.py graphics_integration_v082522.py'.split()
          report=[]
          for name in names:
              p=root/'tests'/name
              s=p.read_text()
              if '0.8.24.12-alpha' in s: p.write_text(s.replace('0.8.24.12-alpha',current))
              try:
                  r=subprocess.run([sys.executable,str(p)],capture_output=True,text=True,timeout=80)
                  status='PASS' if r.returncode==0 else 'FAIL';tail=(r.stdout+'\n'+r.stderr)[-1600:]
              except subprocess.TimeoutExpired as e:status='TIMEOUT';tail=str(e)
              report.append({'name':name,'status':status,'tail':tail})
              print(status,name,flush=True)
              if status!='PASS':print(tail[-1000:].replace('\n',' '),flush=True)
              (root/'docs/qa_runs_targeted/results.json').write_text(json.dumps(report,indent=2))
          print('SUMMARY',json.dumps({s:sum(x['status']==s for x in report) for s in ['PASS','FAIL','TIMEOUT']}))
          sys.exit(1 if any(x['status']!='PASS' for x in report) else 0)
          PY
      - name: Preserve browser evidence even after failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: targeted-browser-regression-results
          path: |
            docs/qa_runs_targeted/
            docs/qa_runs_v082530/
          retention-days: 30
