name: Apply Verified 2026 Squad Gap Fixes
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/apply-verified-2026-rosters.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          persist-credentials: true
      - name: Apply only cited 2026 first-team replacements
        run: python3 scripts/apply_verified_roster_gap_fixes.py
      - name: Validate 165 clubs, source parity, graphics and roster constraints
        run: |
          python3 scripts/validate_data.py
          node tests/all_club_fc27_rosters.mjs
          node tests/club26_fc27_roster.mjs
          python3 scripts/build.py
          node --test tests/*.test.cjs
          python3 -m compileall -q scripts tests
      - name: Persist updated club and runtime source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/players/continental.json src/roster_corrections.js docs/CLUB_ROSTER_FC27_ALL_CLUBS_20261015.json
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: replace independently verified 2026 goalkeeper academy slots"
          for retry in 1 2 3; do
            git pull --rebase origin dev && git push origin HEAD:dev && exit 0
            sleep 3
          done
          exit 1
