name: Crown Royals Reference Sprite QA
on:
  push:
    branches: [dev]
    paths:
      - 'src/modules/crownroyals.js'
      - 'src/modules/render.js'
      - 'src/modules/ui.js'
      - 'assets/crown_royals/**'
      - 'crown-royals-visual-qa.html'
      - 'tests/crown_royals*'
      - 'scripts/build.py'
      - '.github/workflows/crown-royals-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sprite-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Chromium and Python QA tools
        run: |
          python3 -m pip install --user playwright pillow
          sudo apt-get update -qq
          sudo apt-get install -y chromium
      - name: Focused tests and offline fixture build
        run: |
          node --test tests/crown_royals_reference.test.cjs
          python3 scripts/build.py
      - name: Capture actual game renderer in Chromium
        run: python3 tests/crown_royals_browser_qa.py
      - name: Verify Crown Royals in actual desktop and touch matches
        run: python3 tests/crown_royals_match_browser_qa.py
      - name: Preserve browser screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crown-royals-alex-game-screenshots
          path: docs/qa_runs_crown_royals/
          retention-days: 30
