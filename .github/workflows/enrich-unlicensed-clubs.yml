name: Enrich Non-FC27 Clubs from Current Squads
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/enrich-unlicensed-clubs.yml']
permissions:
  contents: write
jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          persist-credentials: true
      - run: python3 -m pip install --user beautifulsoup4
      - name: Fill unresolved club slots from exact current squad pages
        run: python3 scripts/enrich_nonfc27_clubs.py
      - name: Validate all 223 team rosters, quotas and source traceability
        run: |
          python3 scripts/validate_data.py
          node tests/all_club_fc27_rosters.mjs
          node tests/club26_fc27_roster.mjs
          python3 scripts/build.py
          node --test tests/*.test.cjs
      - name: Record enrichment outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nonfc27-direct-club-source-audit
          path: docs/CLUB_ROSTER_FC27_ALL_CLUBS_20261015.json
          retention-days: 30
      - name: Push proven roster changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/players/continental.json src/roster_corrections.js docs/CLUB_ROSTER_FC27_ALL_CLUBS_20261015.json
          git diff --cached --check
          if git diff --cached --quiet; then echo 'No safe squad updates'; else
            git commit -m "data: add independently sourced players to unlicensed clubs, preserving FC27 ratings"
            git push origin HEAD:dev
          fi
