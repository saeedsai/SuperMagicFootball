name: Verify Live Concept Royals Sprite and Running
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/concept-hero-live-smoke.yml'
      - 'assets/concept_hero/**'
      - 'src/modules/concepthero.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hosted-browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install Chromium and Playwright
        run: |
          python3 -m pip install --user playwright
          sudo apt-get update -qq
          sudo apt-get install -y chromium
      - name: Verify the deployed sprite's transparency and live playable demo on desktop and touch
        run: |
          python3 - <<'PY'
          from playwright.sync_api import sync_playwright
          from pathlib import Path
          import json
          URL='https://saeedsai.github.io/SuperMagicFootball/'
          evidence=Path('docs/qa_runs_live_concept');evidence.mkdir(parents=True,exist_ok=True)
          with sync_playwright() as pw:
           browser=pw.chromium.launch(headless=True,executable_path='/usr/bin/chromium',args=['--no-sandbox','--disable-dev-shm-usage'])
           for device,opts in [('desktop',{'viewport':{'width':1366,'height':860}}),('touch',{'viewport':{'width':844,'height':390},'has_touch':True,'is_mobile':True})]:
            context=browser.new_context(**opts,service_workers='block')
            page=context.new_page();page.set_default_timeout(25000)
            errors=[];page.on('pageerror',lambda exc:errors.append(str(exc)))
            result=None
            for attempt in range(10):
             try:
              response=page.goto(URL+'?concept-qa='+str(attempt),wait_until='domcontentloaded',timeout=55000)
              assert response and response.status==200,'Page HTTP failure'
              page.wait_for_function('!!window.SupermagicFootball && !!window.SupermagicFootball.teams?.find(t=>t.id==="demo_concept_royals")',timeout=35000)
              result=page.evaluate("""async () => {
               const atlas=await fetch('./assets/concept_hero/hero_atlas.webp?qa='+Date.now(),{cache:'no-store'});
               if(!atlas.ok)return {ok:false,reason:'atlas HTTP '+atlas.status};
               const img=await createImageBitmap(await atlas.blob());
               const cv=document.createElement('canvas');cv.width=img.width;cv.height=img.height;
               const ctx=cv.getContext('2d',{willReadFrequently:true});ctx.drawImage(img,0,0);
               const points=[[57,225],[173,231],[372,228],[473,228]];
               const alphas=points.map(([x,y])=>ctx.getImageData(x,y,1,1).data[3]);
               const club=SupermagicFootball.teams.find(t=>t.id==='demo_concept_royals');
               return {ok:alphas.every(v=>v<12)&&club.customRoster.length===12,
                alphas,club:club.name,players:club.customRoster.length,size:[img.width,img.height]};
              }""")
              if not result['ok']:raise AssertionError('Old atlas/branch: '+str(result))
              break
             except Exception as e:
              print('PAGES_CONCEPT_RETRY',device,attempt+1,str(e)[:300],flush=True)
              if attempt==9:raise
              page.wait_for_timeout(16000)
            page.locator('[data-action="navQuick"]').first.click()
            page.locator('[data-action="conceptDemo"]').first.click()
            page.locator('[data-action="kickoff"]').first.click()
            page.wait_for_function('SupermagicFootball.game.matchState==="play"',timeout=25000)
            assert page.evaluate("() => SupermagicFootball.game.players.filter(p=>p.t===0).every(p=>p.src?.renderModel==='concept_hero')"),'Wrong demo player model'
            assert not errors,(device,errors)
            page.screenshot(path=str(evidence/(device+'_live_concept_match.png')))
            print('LIVE_CONCEPT_PASS',device,json.dumps(result,sort_keys=True),flush=True)
            context.close()
           browser.close()
          PY
      - name: Upload hosted live-match evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-concept-royals-check
          path: docs/qa_runs_live_concept/
          retention-days: 14
