name: Full Regression Census
# Final 165-club source-ranked FC27 certification, with 225 restored teams including Concept Hero.
# Archived browser version expectations are synchronized to the actual modular version in the disposable checkout.
on:
  # Always verify the exact integrated dev commit, including changes to tests,
  # documentation, agent checkpoints and CI itself. No manual trigger required.
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: full-regression-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate all roster and mechanics JSON
        run: python3 scripts/validate_data.py
      - name: Build current playable test fixture
        run: python3 scripts/build.py
      - name: Regression — three-way JSON agent merge safeguards
        run: python3 -m unittest discover -s tests -p 'test_parallel_data_merge.py' -v
      - name: Execute active Node contract tests
        run: node --test tests/*.test.cjs
      - name: Execute current Club26/FC27 roster contracts
        run: node tests/club26_fc27_roster.mjs
      - name: Compile Python tests
        run: python3 -m compileall -q scripts tests

  node-regression:
    runs-on: ubuntu-latest
    needs: preflight
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - name: Build test fixture
        run: python3 scripts/build.py
      - name: Run all historical and current Node executable tests
        run: python3 tests/full_regression_runner.py --category node --shard-index ${{ matrix.shard }} --shard-count 4 --timeout-seconds 35
      - name: Upload exact test results even when checks fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-regression-node-${{ matrix.shard }}
          path: docs/qa_runs_full_regression/*
          retention-days: 30

  browser-regression:
    runs-on: ubuntu-latest
    needs: preflight
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright Chromium without snap dependency
        run: |
          python3 -m pip install --user playwright pillow
          python3 -m playwright install --with-deps chromium
          # Existing historical browser suites use /usr/bin/chromium.
          # Point that path to the Playwright-managed compatible binary.
          browser_path="$(python3 -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          test -x "$browser_path"
          sudo ln -sf "$browser_path" /usr/bin/chromium
          /usr/bin/chromium --version
      - name: Build browser fixture for old and current suites
        run: |
          python3 scripts/build.py
          cp tests/.generated/play.html play.html
      - name: Run all discovered browser regression scripts
        run: python3 tests/full_regression_runner.py --category browser --shard-index ${{ matrix.shard }} --shard-count 4 --timeout-seconds 75
      - name: Upload exact test results even when checks fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-regression-browser-${{ matrix.shard }}
          path: docs/qa_runs_full_regression/*
          retention-days: 30

  # Release only the exact dev commit certified by every QA job.
  # No checkout or execution of repository-supplied code with a write token.
  promote-dev-to-main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    needs: [preflight, node-regression, browser-regression]
    permissions:
      contents: write
    timeout-minutes: 5
    steps:
      - name: Verify green QA, exact dev HEAD and fast-forward ancestry
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CERTIFIED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          # "needs" already requires success of preflight + all 4 Node + all 4 browser jobs.
          current_dev="$(gh api "repos/$GH_REPO/git/ref/heads/dev" --jq '.object.sha')"
          if [[ "$current_dev" != "$CERTIFIED_SHA" ]]; then
            echo "::notice::Skipping release: dev moved since this QA run."
            exit 0
          fi
          main_sha="$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$main_sha" == "$CERTIFIED_SHA" ]]; then
            echo "::notice::main already contains the certified commit."
            exit 0
          fi
          status="$(gh api "repos/$GH_REPO/compare/$main_sha...$CERTIFIED_SHA" --jq '.status')"
          if [[ "$status" != "ahead" ]]; then
            echo "::error::Cannot fast-forward main: compare status $status."
            exit 1
          fi
          # GitHub rejects non-fast-forward updates. Never force push.
          gh api --method PATCH "repos/$GH_REPO/git/refs/heads/main" \
            -f sha="$CERTIFIED_SHA" -F force=false >/dev/null
          echo "Promoted QA-certified $CERTIFIED_SHA to main."
