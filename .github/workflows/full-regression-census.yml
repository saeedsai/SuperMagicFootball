name: Full Regression Census
# Final 165-club source-ranked FC27 certification, with 225 restored teams including Concept Hero.
# Archived browser version expectations are synchronized to the actual modular version in the disposable checkout.
on:
  # Always verify the exact integrated dev commit, including changes to tests,
  # documentation, agent checkpoints and CI itself. No manual trigger required.
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: full-regression-${{ github.ref }}
  # Newer exact-head releases supersede obsolete dev/main CI runs without skipping any shards.
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate all roster and mechanics JSON
        run: python3 scripts/validate_data.py
      - name: Build current playable test fixture
        run: python3 scripts/build.py
      - name: Regression — three-way JSON agent merge safeguards
        run: python3 -m unittest discover -s tests -p 'test_parallel_data_merge.py' -v
      - name: Execute active Node contract tests
        run: node --test tests/*.test.cjs
      - name: Execute current Club26/FC27 roster contracts
        run: node tests/club26_fc27_roster.mjs
      - name: Compile Python tests
        run: python3 -m compileall -q scripts tests

  node-regression:
    runs-on: ubuntu-latest
    needs: preflight
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - name: Build test fixture
        run: python3 scripts/build.py
      - name: Run all historical and current Node executable tests
        run: python3 tests/full_regression_runner.py --category node --shard-index ${{ matrix.shard }} --shard-count 4 --timeout-seconds 35
      - name: Upload exact test results even when checks fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-regression-node-${{ matrix.shard }}
          path: docs/qa_runs_full_regression/*
          retention-days: 30

  browser-regression:
    runs-on: ubuntu-latest
    needs: preflight
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright Chromium without snap dependency
        run: |
          python3 -m pip install --user playwright pillow
          python3 -m playwright install --with-deps chromium
          # Existing historical browser suites use /usr/bin/chromium.
          # Point that path to the Playwright-managed compatible binary.
          browser_path="$(python3 -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          test -x "$browser_path"
          sudo ln -sf "$browser_path" /usr/bin/chromium
          /usr/bin/chromium --version
      - name: Build browser fixture for old and current suites
        run: |
          python3 scripts/build.py
          cp tests/.generated/play.html play.html
      - name: Run all discovered browser regression scripts
        run: python3 tests/full_regression_runner.py --category browser --shard-index ${{ matrix.shard }} --shard-count 4 --timeout-seconds 75
      - name: Upload exact test results even when checks fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-regression-browser-${{ matrix.shard }}
          path: docs/qa_runs_full_regression/*
          retention-days: 30

  # Serve the actual modular site over HTTP, not only the generated HTML fixture.
  # A failing desktop/touch kickoff blocks promotion to main.
  preview-smoke:
    runs-on: ubuntu-latest
    needs: preflight
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Chromium for browser smoke
        run: |
          python3 -m pip install --user playwright
          python3 -m playwright install --with-deps chromium
      - name: Validate desktop and simulated-touch match kickoff over HTTP
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess, time, urllib.request
          from playwright.sync_api import sync_playwright
          server=subprocess.Popen(['python3','-m','http.server','8765','--bind','127.0.0.1'],
                                  stdout=subprocess.DEVNULL,stderr=subprocess.STDOUT)
          try:
              for _ in range(40):
                  try:
                      with urllib.request.urlopen('http://127.0.0.1:8765/',timeout=2) as r:
                          assert r.status==200
                      break
                  except Exception:
                      time.sleep(.25)
              else:
                  raise AssertionError('HTTP preview server did not start')
              with sync_playwright() as pw:
                  browser=pw.chromium.launch(headless=True,args=['--no-sandbox','--disable-dev-shm-usage'])
                  for name,mobile in [('desktop',False),('simulated-touch',True)]:
                      ctx=browser.new_context(viewport={'width':844 if mobile else 1280,
                                                       'height':390 if mobile else 720},
                                              is_mobile=mobile,has_touch=mobile)
                      page=ctx.new_page()
                      errors=[]
                      failed_requests=[]
                      console_errors=[]
                      bad_responses=[]
                      page.on('console',lambda message: console_errors.append(message.text) if message.type=='error' else None)
                      page.on('response',lambda response: bad_responses.append((response.status,response.url)) if response.status>=400 else None)
                      page.on('requestfailed',lambda request: failed_requests.append(request.url))
                      page.on('pageerror',lambda error: errors.append(str(error)))
                      response=page.goto('http://127.0.0.1:8765/',wait_until='load',timeout=60000)
                      assert response and response.status==200,(name,'HTTP failed')
                      try:
                          page.wait_for_function('!!window.SupermagicFootball?.game',timeout=60000)
                      except Exception:
                          print('PREVIEW_STARTUP_DIAGNOSTICS',name,'page_errors=',errors,'menu=',page.locator('#menu').inner_text(timeout=5000)[:1500],'failed_requests=',failed_requests,'http_errors=',bad_responses,'console_errors=',console_errors,flush=True)
                          raise
                      for action in ('navQuick','navOnDevice','versus','kickoff'):
                          page.locator('[data-action="'+action+'"]').first.click(timeout=30000)
                      state=page.evaluate('''() => ({
                        state:SupermagicFootball.game.matchState,
                        buttons:document.querySelectorAll('#touchButtons button[data-act]').length,
                        canvas:!!document.querySelector('#field'),
                        teams:SupermagicFootball.game.teamIds.length
                      })''')
                      assert state['state']=='play' and state['buttons']==4 and state['canvas'],(name,state)
                      assert state['teams']==2,(name,state)
                      assert not errors,(name,errors)
                      print('PREVIEW_SMOKE_PASS',name,state,flush=True)
                      ctx.close()
                  browser.close()
          finally:
              server.terminate()
              try: server.wait(timeout=5)
              except subprocess.TimeoutExpired: server.kill()
          PY

  # Release only the exact dev commit certified by every QA job.
  # No checkout or execution of repository-supplied code with a write token.
  promote-dev-to-main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    needs: [preflight, node-regression, browser-regression, preview-smoke]
    permissions:
      contents: write
      actions: write
    timeout-minutes: 5
    steps:
      - name: Verify green QA, exact dev HEAD and fast-forward ancestry
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CERTIFIED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          # "needs" already requires success of preflight + all 4 Node + all 4 browser jobs.
          current_dev="$(gh api "repos/$GH_REPO/git/ref/heads/dev" --jq '.object.sha')"
          if [[ "$current_dev" != "$CERTIFIED_SHA" ]]; then
            echo "::notice::Skipping release: dev moved since this QA run."
            exit 0
          fi
          main_sha="$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$main_sha" == "$CERTIFIED_SHA" ]]; then
            echo "::notice::main already contains the certified commit."
            exit 0
          fi
          status="$(gh api "repos/$GH_REPO/compare/$main_sha...$CERTIFIED_SHA" --jq '.status')"
          if [[ "$status" != "ahead" ]]; then
            echo "::error::Cannot fast-forward main: compare status $status."
            exit 1
          fi
          # GitHub rejects non-fast-forward updates. Never force push.
          gh api --method PATCH "repos/$GH_REPO/git/refs/heads/main" \
            -f sha="$CERTIFIED_SHA" -F force=false >/dev/null
          echo "Promoted QA-certified $CERTIFIED_SHA to main."
          # GITHUB_TOKEN pushes do not trigger ordinary push workflows.
          # Explicitly start the main verification run for hosted smoke evidence.
          gh workflow run full-regression-census.yml --repo "$GH_REPO" --ref main

  # Check that GitHub Pages eventually serves the released game after main moves.
  # Pages branch deployments are asynchronous; retry rather than testing immediately.
  hosted-pages-smoke:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Wait for public game HTML and modular entrypoint
        shell: bash
        run: |
          python3 - <<'PY'
          import time, urllib.request, urllib.error, hashlib, re
          from pathlib import Path
          root='https://saeedsai.github.io/SuperMagicFootball/'
          paths=('', 'src/main.js', 'style.css', 'src/modules/ui.js', 'src/modules/release.js')
          local_paths={'':'index.html', 'src/main.js':'src/main.js', 'style.css':'style.css', 'src/modules/ui.js':'src/modules/ui.js', 'src/modules/release.js':'src/modules/release.js'}
          expected={path:hashlib.sha256(Path(local_paths[path]).read_bytes()).hexdigest() for path in paths}
          for attempt in range(36):
              try:
                  results={}
                  for path in paths:
                      request=urllib.request.Request(root+path,headers={'Cache-Control':'no-cache'})
                      with urllib.request.urlopen(request,timeout=15) as response:
                          data=response.read()
                          assert response.status==200 and data,(path,response.status)
                          results[path]=data
                  assert b'SUPERMAGIC FOOTBALL' in results[''], 'Wrong HTML page'
                  assert b'id="field"' in results[''], 'Missing playable canvas'
                  assert b'type="module"' in results[''], 'Missing module entrypoint'
                  local_release=Path('src/modules/release.js').read_bytes()
                  matched=re.search(rb"\bversion\s*:\s*['\"](\d+\.\d+\.\d+\.\d+)['\"]",local_release)
                  assert matched, 'Checked-out main has no valid four-field About release version'
                  assert matched.group(0) in results['src/modules/release.js'], 'Hosted About version differs from checked-out main: '+matched.group(1).decode()
                  actual={path:hashlib.sha256(results[path]).hexdigest() for path in paths}
                  assert actual==expected, 'Hosted Pages is stale versus checked-out main: '+str({p:(expected[p],actual[p]) for p in paths if expected[p]!=actual[p]})
                  print('HOSTED_PAGES_SMOKE_PASS',root,'exact main HTML, JS and CSS bytes',flush=True)
                  break
              except Exception as exc:
                  if attempt==35: raise
                  print('Pages not ready',attempt+1,str(exc),flush=True)
                  time.sleep(15)
          PY
