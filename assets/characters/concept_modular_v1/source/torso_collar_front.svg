<svg xmlns="http://www.w3.org/2000/svg" width="112" height="265" viewBox="0 0 112 265" role="img" aria-label="Editable painted front football jersey collar and shoulder seams">
<title>Royals painted front collar and shoulder join — C01 001</title>
<desc>Experimental transparent shoulder-seam and jersey neckline accent for the 112 by 265 original concept figure. Seven named editable groups; no baked body repaint, no white canvas and no change to original silhouette.</desc>
