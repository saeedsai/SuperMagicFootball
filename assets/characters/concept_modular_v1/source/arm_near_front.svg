<svg xmlns="http://www.w3.org/2000/svg" width="112" height="265" viewBox="0 0 112 265" role="img" aria-label="Modular painted front-view near arm with sleeve, forearm and gloved hand">
<title>Royals front near arm — painted component 001</title>
