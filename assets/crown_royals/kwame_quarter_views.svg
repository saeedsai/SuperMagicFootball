  <path d="M15 47 12 57 15 62" stroke="#b96f4b" stroke-width="1" fill="none"/>
 </g>
 <g transform="translate(48 0)" data-view="quarterBack" data-orientation="rear-facing">
  <path d="M16 63 13 77 11 83 23 84 26 66M28 65 35 77 39 84 46 82 38 62" fill="#401a85"/>
