<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"/><meta name="theme-color" content="#08182b"/><meta name="apple-mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/><meta name="apple-mobile-web-app-title" content="Supermagic Football"/><meta name="mobile-web-app-capable" content="yes"/><meta name="description" content="Independent browser-native HD arcade soccer game. No emulator or ROM needed."/><link rel="apple-touch-icon" href="icon-180.png"/><title>SUPERMAGIC FOOTBALL · v0.8.25.31 · MODULAR</title><link rel="stylesheet" href="style.css"/></head><body>
<div id="app"><canvas id="field" aria-label="Supermagic Football playable soccer field"></canvas>
<div id="menu" class="menu" aria-live="polite"></div>
<div id="hud" class="hud hidden"><div class="scoregroup"><span id="homeflag">JP</span><span id="homename">JAPAN</span><strong id="scoring">0 <span>:</span> 0</strong><span id="awayname">BRAZIL</span><span id="awayflag">BR</span></div><div class="hudright"><span id="weatherHud">☀ CLEAR</span><span id="timeHud">1ST • 2:00</span><button id="fullscreenMatch" type="button" title="Toggle fullscreen" aria-label="Toggle fullscreen">⛶</button><button id="pauseBtn" title="Pause game">Ⅱ</button></div><div id="powerMeter"><div id="powerFill"></div></div><div id="specialMeter">★ READY</div><div id="playerTag">#9 KUNIO • NUTS SHOT</div><div id="staminaHud"><span id="staminaText">STAMINA 100%</span><div class="staminaTrack"><div id="staminaFill"></div></div></div><div id="gameToast" class="toast hidden"></div></div>
<output id="perfHud" class="perfHud hidden" aria-label="Current game performance" aria-live="off"></output>
<div id="mobile" class="mobile hidden"><div id="joyZone"><div id="joyStick"><div id="joyKnob"></div></div></div><div id="touchButtons" aria-label="Four context-sensitive actions"><button data-act="jump" class="round jump" aria-label="Jump or run">JUMP</button><button data-act="pass" class="round pass" aria-label="Pass or tackle">PASS</button><button data-act="shoot" class="round shoot" aria-label="Shoot or slide tackle">SHOOT</button><button data-act="dribble" class="round dribble" aria-label="Dribble or switch player">DRIBBLE</button></div></div>
<div id="fullscreenHelp" class="fullscreenHelp hidden" role="dialog" aria-modal="true" aria-labelledby="fullscreenHelpTitle"><div class="fullscreenHelpCard"><h2 id="fullscreenHelpTitle">FULLSCREEN ON YOUR DEVICE</h2><p id="fullscreenHelpText">Use landscape mode for the best view.</p><button type="button" id="fullscreenHelpClose">GOT IT</button></div></div><div id="rotate" class="rotate hidden"><div>↻</div><strong>LANDSCAPE RECOMMENDED</strong><span>Rotate your phone for a full-size soccer field. The game is still playable vertically.</span><button id="dismissRotate">PLAY ANYWAY</button></div>
</div><script type="module" src="src/main.js"></script></body></html>
